<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADsP 실전 모의고사 1회</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --line:#2c313c;
    --txt:#e8eaed; --sub:#9aa0aa; --accent:#5b8cff; --accent2:#7aa2ff;
    --ok:#2ecc71; --okbg:#12331f; --no:#ff5c5c; --nobg:#361618; --warn:#ffb84d;
  }
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--txt); line-height:1.6; padding-bottom:40px; }
  .wrap{ max-width:640px; margin:0 auto; padding:0 16px; }
  header{ position:sticky; top:0; z-index:10; background:rgba(15,17,21,.92);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .hbar{ max-width:640px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .title{ font-size:15px; font-weight:700; letter-spacing:-.3px; }
  .title small{ color:var(--sub); font-weight:500; }
  .timer{ font-variant-numeric:tabular-nums; font-weight:700; font-size:16px; padding:6px 12px; border-radius:10px; background:var(--card2); border:1px solid var(--line); }
  .timer.warn{ color:var(--warn); border-color:var(--warn); }
  .timer.danger{ color:var(--no); border-color:var(--no); animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{opacity:.55} }
  .progbar{ height:4px; background:var(--card2); }
  .progfill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%; transition:width .3s ease; }

  .intro{ text-align:center; padding:48px 20px 30px; }
  .badge{ display:inline-block; font-size:12px; font-weight:700; color:var(--accent2); background:rgba(91,140,255,.12); padding:6px 14px; border-radius:20px; margin-bottom:20px; }
  .intro h1{ font-size:26px; letter-spacing:-.5px; margin-bottom:10px; }
  .intro p{ color:var(--sub); font-size:15px; margin-bottom:6px; }
  .meta{ display:flex; gap:10px; justify-content:center; margin:26px 0; flex-wrap:wrap; }
  .chip{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 18px; min-width:90px; }
  .chip .n{ font-size:22px; font-weight:800; color:var(--accent2); }
  .chip .l{ font-size:12px; color:var(--sub); margin-top:2px; }
  .field{ text-align:left; margin:14px 0; }
  .field label{ display:block; font-size:13px; color:var(--sub); margin-bottom:6px; font-weight:600; }
  .field input{ width:100%; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; color:var(--txt); font-size:15px; font-family:inherit; }
  .field input:focus{ outline:none; border-color:var(--accent); }
  .formbox{ max-width:360px; margin:10px auto 24px; }
  .rulebox{ text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:20px auto; max-width:420px; font-size:13px; color:var(--sub); }
  .rulebox b{ color:var(--txt); }

  .btn{ display:inline-block; width:100%; border:none; cursor:pointer; font-family:inherit; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:16px; font-weight:700; padding:16px; border-radius:14px; transition:transform .1s, opacity .2s; }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.ghost{ background:var(--card2); color:var(--txt); border:1px solid var(--line); }

  .qwrap{ padding:22px 0; }
  .qtop{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .qnum{ font-size:13px; color:var(--accent2); font-weight:700; }
  .subjtag{ font-size:11px; font-weight:700; color:var(--sub); background:var(--card2); border:1px solid var(--line); padding:2px 8px; border-radius:6px; }
  .qtext{ font-size:18px; font-weight:600; letter-spacing:-.3px; margin-bottom:22px; word-break:keep-all; }
  .opts{ display:flex; flex-direction:column; gap:10px; }
  .opt{ text-align:left; background:var(--card); border:1.5px solid var(--line); color:var(--txt); padding:15px 16px; border-radius:13px; font-size:15px; font-family:inherit; cursor:pointer; display:flex; align-items:center; gap:12px; transition:border-color .15s, background .15s; word-break:keep-all; }
  .opt:active{ background:var(--card2); }
  .opt .k{ flex-shrink:0; width:26px; height:26px; border-radius:8px; background:var(--card2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--sub); }
  .opt.sel{ border-color:var(--accent); background:rgba(91,140,255,.08); }
  .opt.sel .k{ background:var(--accent); color:#fff; border-color:var(--accent); }

  .nav{ display:flex; gap:10px; margin-top:24px; }
  .nav .btn{ flex:1; }
  .palette{ display:grid; grid-template-columns:repeat(10,1fr); gap:6px; margin-top:26px; }
  .pcell{ aspect-ratio:1; border-radius:8px; background:var(--card); border:1px solid var(--line); font-size:12px; font-weight:700; color:var(--sub); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .pcell.done{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .pcell.cur{ outline:2px solid var(--accent2); outline-offset:1px; }
  .palette-label{ font-size:12px; color:var(--sub); margin:24px 0 4px; }

  .result{ text-align:center; padding:36px 20px; }
  .scorecircle{ width:170px; height:170px; margin:6px auto 22px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:conic-gradient(var(--c,var(--accent)) var(--deg,0deg), var(--card2) 0deg); position:relative; }
  .scorecircle::before{ content:''; position:absolute; inset:13px; border-radius:50%; background:var(--bg); }
  .scorecircle .inner{ position:relative; z-index:1; }
  .scorecircle .pct{ font-size:44px; font-weight:800; }
  .scorecircle .lbl{ font-size:13px; color:var(--sub); }
  .verdict{ font-size:24px; font-weight:800; margin-bottom:6px; }
  .verdict.pass{ color:var(--ok); } .verdict.fail{ color:var(--no); }
  .vsub{ color:var(--sub); font-size:14px; margin-bottom:8px; }
  .subjgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:22px 0; }
  .subjcard{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 8px; }
  .subjcard.fail{ border-color:var(--no); background:var(--nobg); }
  .subjcard .sn{ font-size:12px; color:var(--sub); }
  .subjcard .sv{ font-size:20px; font-weight:800; margin-top:4px; }
  .subjcard .sp{ font-size:11px; margin-top:2px; }
  .subjcard .sp.ok{ color:var(--ok); } .subjcard .sp.no{ color:var(--no); }
  .saveState{ font-size:13px; color:var(--sub); margin:14px 0; }
  .review-item{ text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 15px; margin-bottom:10px; }
  .review-item .rq{ font-size:14px; font-weight:600; margin-bottom:8px; word-break:keep-all; }
  .review-item .rq .badge2{ font-size:10px; color:var(--sub); background:var(--card2); padding:1px 6px; border-radius:5px; margin-right:6px; }
  .review-item .ra{ font-size:13px; }
  .review-item .ra.mine{ color:var(--no); } .review-item .ra.ans{ color:var(--ok); }
  .review-item .rh{ font-size:13px; color:var(--sub); margin-top:6px; border-top:1px dashed var(--line); padding-top:6px; }
  .section-title{ text-align:left; font-size:15px; font-weight:700; margin:28px 0 12px; }
  .hidden{ display:none; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--card2); border:1px solid var(--line); color:var(--txt); padding:12px 20px; border-radius:12px; font-size:14px; z-index:100; opacity:0; transition:opacity .3s; }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">ADsP 실전 모의고사 <small>· 1회</small></div>
    <div class="timer" id="timer">70:00</div>
  </div>
  <div class="progbar"><div class="progfill" id="progfill"></div></div>
</header>

<div class="wrap">

    <h1>ADsP 실전 모의고사 1회</h1>
    <p>실제 시험과 동일한 채점 룰로 합격 여부를 즉시 확인합니다.</p>
    <div class="meta">
      <div class="chip"><div class="n">50</div><div class="l">문항</div></div>
      <div class="chip"><div class="n">70</div><div class="l">제한(분)</div></div>
      <div class="chip"><div class="n">60</div><div class="l">합격(점)</div></div>
    </div>
    <div class="formbox">
      <div class="field"><label>이름</label><input id="inName" placeholder="홍길동" autocomplete="off"></div>
      <div class="field"><label>학번</label><input id="inId" placeholder="20250001" autocomplete="off"></div>
    </div>
    <div class="rulebox">
      <b>채점 기준</b><br>
      · 문항당 2점, 100점 만점 · 60점 이상 합격<br>
      · 과목별 40% 미만 시 <b>과락(불합격)</b><br>
      · 1과목(1~10) · 2과목(11~20) · 3과목(21~50)<br>
      · 과락 최소: 1·2과목 각 8점, 3과목 24점
    </div>
    <button class="btn" onclick="startQuiz()">시험 시작하기</button>
  </section>

  <section id="quiz" class="qwrap hidden">
    <div class="qtop"><span class="qnum" id="qnum"></span><span class="subjtag" id="subjtag"></span></div>
    <div class="qtext" id="qtext"></div>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button class="btn ghost" id="prevBtn" onclick="prevQ()">← 이전</button>
      <button class="btn" id="nextBtn" onclick="nextQ()">다음 →</button>
    </div>
    <div class="palette-label">문제 이동 (파란색 = 응답 완료)</div>
    <div class="palette" id="palette"></div>
    <button class="btn" style="margin-top:20px;background:var(--ok)" onclick="submitExam()">답안 제출하고 채점하기</button>
  </section>

  <section id="result" class="result hidden"></section>
</div>
<div class="toast" id="toast"></div>

const SUBJ_NAMES={1:'1과목·데이터 이해',2:'2과목·분석 기획',3:'3과목·데이터 분석'};
const SUBJ_TOTAL={1:10,2:10,3:30};       // 문항수
const SUBJ_PASS_MIN={1:4,2:4,3:12};      // 과락 방지 최소 정답수 (40%)
let idx=0, answers=[], timeLeft=TIME_LIMIT, timerId=null, student={};

window.startQuiz=function(){
  const name=document.getElementById('inName').value.trim();
  const sid=document.getElementById('inId').value.trim();
  if(!name||!sid){ toast('이름과 학번을 입력해주세요'); return; }
  student={name,sid};
  idx=0; answers=new Array(QUIZ.length).fill(null); timeLeft=TIME_LIMIT;
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  buildPalette(); startTimer(); renderQ(); window.scrollTo(0,0);
}

function startTimer(){
  clearInterval(timerId); updateTimerUI();
  timerId=setInterval(()=>{ timeLeft--; updateTimerUI();
    if(timeLeft<=0){ clearInterval(timerId); doGrade(true); } },1000);
}
function updateTimerUI(){
  const m=String(Math.floor(timeLeft/60)).padStart(2,'0');
  const s=String(timeLeft%60).padStart(2,'0');
  const t=document.getElementById('timer'); t.textContent=m+':'+s;
  t.className='timer'+(timeLeft<=60?' danger':(timeLeft<=300?' warn':''));
}

function buildPalette(){
  const p=document.getElementById('palette'); p.innerHTML='';
  QUIZ.forEach((q,i)=>{ const c=document.createElement('button');
    c.className='pcell'; c.textContent=i+1; c.onclick=()=>{idx=i;renderQ();window.scrollTo(0,0);};
    p.appendChild(c); });
}
function refreshPalette(){
  document.querySelectorAll('.pcell').forEach((c,i)=>{
    c.classList.toggle('done', answers[i]!==null);
    c.classList.toggle('cur', i===idx);
  });
}

function renderQ(){
  const q=QUIZ[idx];
  document.getElementById('progfill').style.width=((idx+1)/QUIZ.length*100)+'%';
  document.getElementById('qnum').textContent='문제 '+(idx+1)+' / '+QUIZ.length;
  document.getElementById('subjtag').textContent=SUBJ_NAMES[q.subj];
  document.getElementById('qtext').textContent=q.q;
  const opts=document.getElementById('opts'); opts.innerHTML='';
  q.opts.forEach((o,i)=>{ const b=document.createElement('button');
    b.className='opt'+(answers[idx]===i?' sel':'');
    b.innerHTML='<span class="k">'+KEYS[i]+'</span><span>'+o+'</span>';
    b.onclick=()=>{ answers[idx]=i; renderQ(); refreshPalette(); };
    opts.appendChild(b); });
  document.getElementById('prevBtn').disabled=(idx===0);
  document.getElementById('nextBtn').disabled=(idx===QUIZ.length-1);
  refreshPalette();
}
window.prevQ=()=>{ if(idx>0){idx--;renderQ();window.scrollTo(0,0);} };
window.nextQ=()=>{ if(idx<QUIZ.length-1){idx++;renderQ();window.scrollTo(0,0);} };

window.submitExam=function(){
  const unanswered=answers.filter(a=>a===null).length;
  if(unanswered>0){ if(!confirm('아직 '+unanswered+'문제를 풀지 않았습니다. 제출할까요?')) return; }
  else{ if(!confirm('답안을 제출하고 채점하시겠습니까?')) return; }
  doGrade(false);
}

function doGrade(timeUp){
  clearInterval(timerId);
  const subjScore={1:0,2:0,3:0}, subjCorrect={1:0,2:0,3:0};
  let totalCorrect=0; const wrong=[];
  QUIZ.forEach((q,i)=>{
    const ansIdx=q.opts.indexOf(q.answer);
    const ok=(answers[i]===ansIdx);
    if(ok){ totalCorrect++; subjScore[q.subj]+=2; subjCorrect[q.subj]++; }
    else wrong.push({i,q,sel:answers[i],ansIdx});
  });
  const total=totalCorrect*2;
  let failedSubj=[];
  [1,2,3].forEach(s=>{ if(subjCorrect[s]<SUBJ_PASS_MIN[s]) failedSubj.push(s); });
  const pass=(total>=60 && failedSubj.length===0);
  const result={ name:student.name, sid:student.sid, total, totalCorrect,
    subjCorrect, subjScore, failedSubj, pass, timeUp,
    durationSec:TIME_LIMIT-timeLeft, at:new Date().toISOString() };
  renderResult(result, wrong);
  saveToFirebase(result);
}

function renderResult(r, wrong){
  document.getElementById('progfill').style.width='100%';
  document.getElementById('quiz').classList.add('hidden');
  const el=document.getElementById('result'); el.classList.remove('hidden');
  const color=r.pass?'var(--ok)':'var(--no)';
  let reason='';
  if(!r.pass){
    if(r.failedSubj.length) reason=r.failedSubj.map(s=>SUBJ_NAMES[s].split('·')[0]).join(', ')+' 과락';
    else reason='총점 60점 미만';
  }
  let subjHtml='';
  [1,2,3].forEach(s=>{
    const failed=r.failedSubj.includes(s);
    subjHtml+='<div class="subjcard'+(failed?' fail':'')+'">'+
      '<div class="sn">'+SUBJ_NAMES[s].split('·')[1]+'</div>'+
      '<div class="sv">'+r.subjScore[s]+'점</div>'+
      '<div class="sp '+(failed?'no':'ok')+'">'+r.subjCorrect[s]+'/'+SUBJ_TOTAL[s]+(failed?' 과락':' 통과')+'</div></div>';
  });
  let wrongHtml='';
  if(wrong.length===0){ wrongHtml='<div class="review-item"><div class="rq">🎉 모든 문제를 맞혔습니다!</div></div>'; }
  else wrong.forEach(w=>{
    const mine=(w.sel!=null)?w.q.opts[w.sel]:'미응답';
    wrongHtml+='<div class="review-item"><div class="rq"><span class="badge2">'+SUBJ_NAMES[w.q.subj].split('·')[0]+'</span>'+(w.i+1)+'. '+w.q.q+'</div>'+
      '<div class="ra mine">내 답: '+mine+'</div>'+
      '<div class="ra ans">정답: '+w.q.answer+'</div>'+
      '<div class="rh">💡 '+w.q.hint+'</div></div>';
  });
  const mm=Math.floor(r.durationSec/60), ss=r.durationSec%60;
  el.innerHTML=
    (r.timeUp?'<div class="badge" style="color:var(--no);background:var(--nobg)">⏱ 시간 종료로 자동 제출</div>':'')+
    '<div class="scorecircle" style="--deg:'+(r.total*3.6)+'deg;--c:'+color+'"><div class="inner">'+
      '<div class="pct" style="color:'+color+'">'+r.total+'</div><div class="lbl">점 / 100</div></div></div>'+
    '<div class="verdict '+(r.pass?'pass':'fail')+'">'+(r.pass?'합격 🎉':'불합격')+'</div>'+
    '<div class="vsub">'+r.name+' · '+r.sid+' · '+r.totalCorrect+'/50 정답</div>'+
    (r.pass?'':'<div class="vsub" style="color:var(--no)">사유: '+reason+'</div>')+
    '<div class="subjgrid">'+subjHtml+'</div>'+
    '<div class="saveState" id="saveState">점수 저장 중…</div>'+
    '<div class="nav"><button class="btn ghost" onclick="location.reload()">다시 풀기</button></div>'+
    '<div class="section-title">📝 오답노트 ('+wrong.length+'문제)</div>'+wrongHtml;
  window.scrollTo(0,0);
}

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
</script>
